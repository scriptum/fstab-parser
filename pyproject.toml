[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fstab-parser"
version = "0.1.0"
description = "Parser/serializer for /etc/fstab with formatting preservation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
